<h2>User List</h2>

<table border="1" cellpadding="8" cellspacing="0" style="border-collapse: collapse;">

  <thead>
    <tr>
      <th style="border:1px solid black;">ID</th>
      <th style="border:1px solid black;">Name</th>
      <th style="border:1px solid black;">Email</th>
      <th style="border:1px solid black;">Phone</th>
      <th style="border:1px solid black;">Website</th>
      <th style="border:1px solid black;">Company</th>
      <th style="border:1px solid black;">City</th>
    </tr>
  </thead>

  <tbody>
    @for (u of (userList$ | async); track u.id) {
      <tr>
        <td style="border:1px solid black;">{{ u.id }}</td>
        <td style="border:1px solid black;">{{ u.name | firstCharToUpperCase }}</td>
        <td style="border:1px solid black;">{{ u.email }}</td>
        <td style="border:1px solid black;">{{ u.phone }}</td>
        <td style="border:1px solid black;">{{ u.website }}</td>
        <td style="border:1px solid black;">{{ u.company?.name }}</td>
        <td style="border:1px solid black;">{{ u.address?.city }}</td>
      </tr>
    }
  </tbody>

</table>
